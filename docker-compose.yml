services:
  postgres:
    image: postgres:17-alpine
    container_name: querylab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${QUERYLAB_POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./sql/analyzer_schema.sql:/docker-entrypoint-initdb.d/03-analyzer-schema.sql:ro
      - ./sql/analyzer_schema.sql:/analyzer_schema.sql:ro
      - ./queries:/queries:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
